name: nlalpha

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  data:
    image: ${NLALPHA_IMAGE:-ghcr.io/ruimarj/nlalpha:0.2.4}
    command: ["serve", "data"]
    restart: unless-stopped
    environment:
      NLALPHA_HOST: "0.0.0.0"
      NLALPHA_PORT: "8001"
      NLALPHA_IDENTITY_MODE: "single-user"
      NLALPHA_DATA_PROVIDER: "${NLALPHA_DATA_PROVIDER:-yfinance}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-}"
      NLALPHA_ARTIFACT_BACKEND: "redis"
      NLALPHA_ARTIFACT_REDIS_URL: "redis://redis:6379/0"
      NLALPHA_WORKSPACE_DIR: "/state/workspace"
    ports:
      - "127.0.0.1:${NLALPHA_DATA_PORT:-8001}:8001"
    volumes:
      - nlalpha-state:/state
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  strategy:
    image: ${NLALPHA_IMAGE:-ghcr.io/ruimarj/nlalpha:0.2.4}
    command: ["serve", "strategy"]
    restart: unless-stopped
    environment:
      NLALPHA_HOST: "0.0.0.0"
      NLALPHA_PORT: "8002"
      NLALPHA_IDENTITY_MODE: "single-user"
    ports:
      - "127.0.0.1:${NLALPHA_STRATEGY_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  capability:
    image: ${NLALPHA_IMAGE:-ghcr.io/ruimarj/nlalpha:0.2.4}
    command: ["serve", "capability"]
    restart: unless-stopped
    environment:
      NLALPHA_HOST: "0.0.0.0"
      NLALPHA_PORT: "8003"
      NLALPHA_IDENTITY_MODE: "single-user"
    ports:
      - "127.0.0.1:${NLALPHA_CAPABILITY_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backtest:
    image: ${NLALPHA_IMAGE:-ghcr.io/ruimarj/nlalpha:0.2.4}
    command: ["serve", "backtest"]
    restart: unless-stopped
    environment:
      NLALPHA_HOST: "0.0.0.0"
      NLALPHA_PORT: "8004"
      NLALPHA_IDENTITY_MODE: "single-user"
      NLALPHA_ARTIFACT_BACKEND: "redis"
      NLALPHA_ARTIFACT_REDIS_URL: "redis://redis:6379/0"
      NLALPHA_WORKSPACE_DIR: "/state/workspace"
      JOB_STORE_DSN: "sqlite:////state/backtest-jobs.db"
    ports:
      - "127.0.0.1:${NLALPHA_BACKTEST_PORT:-8004}:8004"
    volumes:
      - nlalpha-state:/state
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  nlalpha-state:
